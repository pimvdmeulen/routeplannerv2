:root{
  color-scheme:light;
  --bg:#EDEFEC;--card:#FFFFFF;--tile:#F5F6F4;--tile-2:#ECEFEB;--ink:#1A1A1A;--ink-2:#3B423D;--muted:#69706A;--faint:#9AA19B;--line:#E2E5E1;
  --pill:#1A1A1A;--pill-ink:#FFFFFF;
  --og:#13A538;--og-deep:#0B4F22;--og-soft:#E3F4E7;--og-ink:#0E7A2A;
  --acc:#F18700;--acc-d:#D97800;--acc-soft:#FDF0DC;--acc-ink:#8A4D00;
  --red:#C9372C;--red-soft:#FBE7E4;--amber:#B86E00;--amber-soft:#FDF0DC;--blue:#2F6FB3;--blue-soft:#E4EEF8;--grey-pin:#7A817B;
  --diesel:#5B636B;
  --shadow:0 1px 2px rgba(20,30,22,.04),0 8px 24px rgba(20,30,22,.06);
  --shadow-lg:0 4px 10px rgba(20,30,22,.08),0 18px 40px rgba(20,30,22,.12);
  --display:"KOMU B","Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-card:24px;--r-tile:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0E100F;--card:#171A18;--tile:#1F2320;--tile-2:#262B27;--ink:#EEF1EE;--ink-2:#CDD3CE;--muted:#A0A8A1;--faint:#727A73;--line:#2A2F2B;
  --pill:#EEF1EE;--pill-ink:#111311;--og:#3CC45E;--og-deep:#0B4F22;--og-soft:#173222;--og-ink:#6FDA8A;
  --acc:#F59A26;--acc-d:#F18700;--acc-soft:#3A2A12;--acc-ink:#F7B865;
  --red:#F0705F;--red-soft:#3A1E1A;--amber:#F2A73A;--amber-soft:#3A2A12;--blue:#79A9E0;--blue-soft:#1A2838;--grey-pin:#8E968F;--diesel:#9AA3AB;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--shadow-lg:0 4px 10px rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0E100F;--card:#171A18;--tile:#1F2320;--tile-2:#262B27;--ink:#EEF1EE;--ink-2:#CDD3CE;--muted:#A0A8A1;--faint:#727A73;--line:#2A2F2B;
  --pill:#EEF1EE;--pill-ink:#111311;--og:#3CC45E;--og-deep:#0B4F22;--og-soft:#173222;--og-ink:#6FDA8A;
  --acc:#F59A26;--acc-d:#F18700;--acc-soft:#3A2A12;--acc-ink:#F7B865;
  --red:#F0705F;--red-soft:#3A1E1A;--amber:#F2A73A;--amber-soft:#3A2A12;--blue:#79A9E0;--blue-soft:#1A2838;--grey-pin:#8E968F;--diesel:#9AA3AB;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--shadow-lg:0 4px 10px rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.4)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:400}
h1{font-family:var(--display);font-size:30px;line-height:1.05;letter-spacing:.01em;color:var(--ink)}
h2{font-family:var(--display);font-size:20px;line-height:1.15;letter-spacing:.01em}
.sub{margin:4px 0 0;color:var(--muted);font-size:13px}

/* ---------- app-raamwerk ---------- */
.app{max-width:1680px;margin:0 auto;padding:14px 16px 10px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:14px;height:100vh;height:100dvh}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0}
.chip{background:var(--card);border-radius:999px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;padding:6px 16px 6px 6px}
.brand .logo{width:40px;height:40px;border-radius:50%;background:#13A538;display:grid;place-items:center;flex-shrink:0}
.brand .logo img{height:26px;width:auto}
.brand-txt b{display:block;font-family:var(--display);font-weight:400;font-size:19px;line-height:1}
.brand-txt small{display:block;color:var(--muted);font-size:11px;line-height:1.3}
.nav{margin:0 auto;background:var(--card);border-radius:999px;box-shadow:var(--shadow);padding:5px;display:flex;gap:2px}
.nav button{border:0;background:transparent;border-radius:999px;padding:9px 18px;white-space:nowrap;font-weight:600;color:var(--ink-2)}
.nav button:hover{background:var(--tile)}
.nav button[aria-selected="true"]{background:var(--pill);color:var(--pill-ink)}
.tools{display:flex;gap:8px;align-items:center}
.chip.sel{padding:5px 8px}
.chip.sel select{border:0;background:transparent;font-weight:700;font-size:13px;padding:6px 4px;cursor:pointer}
.seg-ic{padding:5px;gap:2px}
.ib{width:36px;height:36px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--muted);flex-shrink:0}
.ib:hover{background:var(--tile);color:var(--ink)}
.ib[aria-pressed="true"]{background:var(--pill);color:var(--pill-ink)}
.ib svg{width:18px;height:18px}
.ib.sm{width:30px;height:30px}
.ib.sm svg{width:16px;height:16px}

.layout{display:grid;grid-template-columns:minmax(360px,450px) minmax(0,1fr);gap:16px;min-height:0}
.side{display:flex;flex-direction:column;gap:14px;overflow-y:auto;min-height:0;padding:0 4px 4px 0;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.card{background:var(--card);border-radius:var(--r-card);padding:20px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.card-h .tag{margin-top:4px}
.foot{color:var(--faint);font-size:11.5px;text-align:center;line-height:1.5}
.foot a{color:var(--muted)}

/* ---------- labels & tags ---------- */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap;line-height:1.6}
.t-green{background:var(--og-soft);color:var(--og-ink)}
.t-or{background:var(--acc);color:#1a1200}
.t-amber{background:var(--amber-soft);color:var(--amber)}
.t-red{background:var(--red-soft);color:var(--red)}
.t-grey{background:var(--tile);color:var(--muted)}
.t-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- formulier ---------- */
.pts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;position:relative}
.pt{display:flex;align-items:center;gap:10px;position:relative}
.pt:not(:last-child)::after{content:"";position:absolute;left:13px;top:30px;height:calc(100% - 16px);border-left:2px dotted var(--faint);pointer-events:none}
.pt-dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;flex-shrink:0;background:var(--tile);color:var(--ink);border:2px solid var(--line);z-index:1}
.pt[data-kind="start"] .pt-dot{background:var(--og);border-color:var(--og);color:#fff}
.pt[data-kind="end"] .pt-dot{background:var(--pill);border-color:var(--pill);color:var(--pill-ink)}
.ac{position:relative;flex:1;min-width:0}
.ac input{width:100%}
.ac-list{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 6px);list-style:none;margin:0;padding:6px;background:var(--card);border-radius:16px;box-shadow:var(--shadow-lg);border:1px solid var(--line);max-height:300px;overflow:auto}
.ac-list li{padding:8px 10px;border-radius:10px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;line-height:1.3}
.ac-list li[aria-selected="true"],.ac-list li:hover{background:var(--tile)}
.ac-list li b{display:block;font-weight:600}
.ac-list li small{color:var(--muted);font-size:12px}
.ac-list .ac-ic{width:22px;height:22px;flex-shrink:0;margin-top:1px;color:var(--muted)}
.ac-list .ac-ic img{width:22px;height:22px}
.ac-list .ac-empty{color:var(--muted);cursor:default}

input[type="text"],input[type="search"],input[type="number"],input[type="datetime-local"],.fld input{background:var(--tile);border:1.5px solid transparent;border-radius:12px;padding:10px 12px;min-width:0;width:100%;font-size:14px;transition:border-color .12s,background .12s}
input:hover{border-color:var(--line)}
input:focus{outline:none;border-color:var(--og);background:var(--card)}
input.bad{border-color:var(--red);background:var(--red-soft)}
input.ok{background-image:linear-gradient(var(--og),var(--og));background-size:3px 60%;background-position:0 50%;background-repeat:no-repeat}
.pts-actions{display:flex;gap:14px;margin:10px 0 4px 38px;flex-wrap:wrap}
.lnk{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:2px 0;color:var(--og-ink);font-weight:600;font-size:13px}
.lnk:hover{text-decoration:underline}
.lnk svg{width:16px;height:16px}
.lnk:disabled{color:var(--faint);text-decoration:none;cursor:default}

.fold{border-top:1px solid var(--line);margin-top:14px}
.fold summary{list-style:none;display:flex;align-items:center;gap:10px;justify-content:space-between;padding:14px 0 4px;cursor:pointer;font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2)}
.fold summary::-webkit-details-marker{display:none}
.fold summary>span:first-child{display:flex;align-items:center;gap:8px}
.fold summary>span:first-child::before{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;margin-right:2px}
.fold[open] summary>span:first-child::before{transform:rotate(45deg)}
.fold-b{padding:8px 0 2px;display:flex;flex-direction:column;gap:12px}
.seg{display:inline-flex;background:var(--tile);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.seg.wide{display:flex}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:7px 10px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.grid-f{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span,.rng>span{font-size:12px;font-weight:600;color:var(--muted)}
.in-u{position:relative;display:flex;align-items:center}
.in-u input{padding-right:62px}
.in-u i{position:absolute;right:11px;font-style:normal;font-size:11.5px;color:var(--faint);pointer-events:none}
.in-2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.in-2 .in-u input{padding-right:24px}
.rng{display:flex;flex-direction:column;gap:2px}
.rng>span{display:flex;justify-content:space-between}
.rng output{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
input[type="range"]{-webkit-appearance:none;appearance:none;width:100%;height:6px;margin:9px 0;border-radius:99px;cursor:pointer;
  background:linear-gradient(var(--og),var(--og)) 0 0/var(--p,50%) 100% no-repeat,var(--tile-2)}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--card);border:3px solid var(--og);box-shadow:0 1px 4px rgba(0,0,0,.25)}
input[type="range"]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--card);border:3px solid var(--og);box-shadow:0 1px 4px rgba(0,0,0,.25)}
input[type="range"]:focus-visible{outline-offset:6px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-2);cursor:pointer;line-height:1.4}
.chk input{width:17px;height:17px;margin:1px 0 0;accent-color:var(--og);flex-shrink:0}
.form-foot{display:flex;gap:10px;margin-top:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:11px 20px;font-weight:700;font-size:14px;white-space:nowrap;transition:transform .12s,background .12s,box-shadow .12s}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--acc);color:#1a1200;flex:1;box-shadow:0 4px 14px rgba(241,135,0,.28)}
.btn.primary:hover{background:var(--acc-d);transform:translateY(-1px)}
.btn.primary:disabled{opacity:.6;transform:none;cursor:progress}
.btn.green{background:var(--og);color:#fff}
.btn.ghost{background:var(--tile);color:var(--ink-2)}
.btn.ghost:hover{background:var(--tile-2);color:var(--ink)}
.btn.sm{padding:7px 13px;font-size:12.5px}
.form-msg{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--red-soft);color:var(--red);font-weight:600;font-size:13px}

/* ---------- resultaten ---------- */
.results{display:flex;flex-direction:column;gap:14px}
.results:empty{display:none}
.r-title{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.r-title h2{font-size:22px}
.r-title .sub{margin-top:2px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--tile);border-radius:var(--r-tile);padding:12px 14px;min-width:0}
.kpi .lab{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.kpi .val{font-family:var(--display);font-size:30px;line-height:1.05;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .val small{font-family:var(--body);font-size:12px;font-weight:700;color:var(--muted);margin-left:3px}
.kpi .dl{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.hero{grid-column:1/-1;background:var(--og);color:#fff;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.kpi.hero .lab,.kpi.hero .dl,.kpi.hero .val small{color:rgba(255,255,255,.85)}
.kpi.hero .val{font-size:38px}
.kpi.hero .side-v{text-align:right}
.kpi.hero .side-v .val{font-size:26px}
:root[data-theme="dark"] .kpi.hero{background:#13A538}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kpi.hero{background:#13A538}}
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:14px;font-size:13px;line-height:1.45;margin-top:12px}
.alert svg{width:18px;height:18px;flex-shrink:0;margin-top:1px}
.alert.warn{background:var(--amber-soft);color:var(--amber)}
.alert.bad{background:var(--red-soft);color:var(--red)}
.alert.info{background:var(--og-soft);color:var(--og-ink)}
.alert b{font-weight:700}

.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.sec-h h3{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2)}
.sec-h small{color:var(--muted);font-size:12px}

/* tijdlijn */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:38px minmax(0,1fr);gap:12px;position:relative;padding-bottom:16px}
.tl li:last-child{padding-bottom:0}
.tl li:not(:last-child)::before{content:"";position:absolute;left:18px;top:36px;bottom:2px;border-left:3px solid var(--og);opacity:.35}
.tl li.leg-gap:not(:last-child)::before{border-left-style:dashed;border-color:var(--red);opacity:.8}
.node{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--tile);border:2px solid var(--line);color:var(--ink);z-index:1;cursor:pointer}
.node img{width:26px;height:26px;object-fit:contain}
.node svg{width:18px;height:18px}
.node.start{background:var(--og);border-color:var(--og);color:#fff}
.node.end{background:var(--pill);border-color:var(--pill);color:var(--pill-ink)}
.node.og{background:#fff;border:2.5px solid #13A538}
.node.cng{background:var(--grey-pin);border-color:var(--grey-pin);color:#fff}
.node.gap{background:var(--red);border-color:var(--red);color:#fff}
.tl-b{min-width:0;padding-top:1px}
.tl-t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tl-t b{font-weight:700;font-size:14px;overflow-wrap:anywhere}
.tl-t time{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tl-m{color:var(--muted);font-size:12.5px;margin-top:1px}
.tl-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tank{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tank-bar{flex:1;max-width:150px;height:7px;border-radius:99px;background:var(--tile-2);overflow:hidden;position:relative}
.tank-bar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--og)}
.tank-bar i.low{background:var(--acc)}
.tank-bar i.crit{background:var(--red)}
.tl-act{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pill-a{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--tile);color:var(--ink-2);text-decoration:none;border:0}
.pill-a:hover{background:var(--tile-2);color:var(--ink)}
.pill-a svg{width:13px;height:13px}

/* tankgrafiek */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .ax text{fill:var(--muted);font-size:10.5px;font-family:var(--body)}
.chart .lvl{stroke:var(--og);stroke-width:2.5;fill:none}
.chart .area{fill:var(--og);opacity:.12}
.chart .res{stroke:var(--acc);stroke-width:1.5;stroke-dasharray:4 4}
.chart .res-t{fill:var(--acc-ink);font-size:10.5px;font-weight:700;font-family:var(--body)}
.chart .stop-dot{fill:var(--card);stroke:var(--og);stroke-width:2.5}
.chart .stop-dot.cng{stroke:var(--grey-pin)}
.chart .stop-dot.gap{stroke:var(--red)}
.chart .stop-n{fill:var(--ink);font-size:10px;font-weight:700;font-family:var(--body)}
.chart-wrap{position:relative}
.chart-tip{position:absolute;pointer-events:none;background:var(--pill);color:var(--pill-ink);font-size:12px;font-weight:600;padding:4px 9px;border-radius:8px;transform:translate(-50%,-130%);white-space:nowrap}

/* kosten */
.cmp{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.cmp-row{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.cmp-row b{font-weight:700}
.cmp-bar{height:14px;border-radius:99px;background:var(--tile);overflow:hidden}
.cmp-bar i{display:block;height:100%;border-radius:99px}
.cmp-row .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;min-width:74px}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:right;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 6px;border-bottom:1px solid var(--line)}
.tbl td{text-align:right;padding:7px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tfoot td{font-weight:700;border-bottom:0}
.tbl .sav{color:var(--og-ink);font-weight:700}
.tbl .neg{color:var(--red);font-weight:700}
.note{color:var(--muted);font-size:11.5px;margin:12px 0 0;line-height:1.5}
.note button{font-size:11.5px}

/* export */
.ex-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ex{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;background:var(--tile);border:0;text-align:left;color:var(--ink);text-decoration:none;min-width:0}
.ex:hover{background:var(--tile-2)}
.ex svg{width:20px;height:20px;flex-shrink:0;color:var(--og-ink)}
.ex b{display:block;font-size:13px;font-weight:700;line-height:1.2}
.ex small{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}
.ex.wide{grid-column:1/-1;background:var(--og-soft)}

/* lege staat */
.empty-card{text-align:left}
.steps{list-style:none;padding:0;margin:4px 0 0;display:flex;flex-direction:column;gap:12px}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;font-size:13px;color:var(--ink-2)}
.steps li span{width:30px;height:30px;border-radius:50%;background:var(--og-soft);color:var(--og-ink);display:grid;place-items:center;font-weight:700}
.steps b{display:block;color:var(--ink)}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}

/* ---------- kaart ---------- */
.mapcard{padding:0;overflow:hidden;position:relative;min-height:320px}
#map{position:absolute;inset:0}
.map-legend{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none;max-width:calc(100% - 24px)}
.map-legend span{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:4px 10px 4px 6px;font-size:11.5px;font-weight:600;box-shadow:var(--shadow);color:var(--ink-2)}
.map-legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.map-busy{position:absolute;inset:0;background:color-mix(in srgb,var(--card) 55%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:700;color:var(--ink-2);backdrop-filter:blur(2px);z-index:5}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--og-soft);border-top-color:var(--og);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}

.mk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.3);border:2.5px solid #fff;cursor:pointer;font-family:var(--body)}
.mk.start{background:#13A538;color:#fff}
.mk.end{background:#1A1A1A;color:#fff}
.mk.via{background:#fff;color:#1A1A1A;border-color:#1A1A1A}
.mk-stop{position:relative;width:40px;height:44px;cursor:pointer;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.mk-stop .pin{position:absolute;left:0;top:0;width:40px;height:40px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#fff;border:2.5px solid #13A538}
.mk-stop img{position:absolute;left:8px;top:7px;width:24px;height:25px}
.mk-stop b{position:absolute;right:-6px;top:-6px;min-width:19px;height:19px;border-radius:99px;background:#F18700;color:#1a1200;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid #fff;font-family:var(--body)}
.mk-stop.cng .pin{border-color:#7A817B;background:#7A817B}
.mk-stop.gap .pin{border-color:#C9372C;background:#C9372C}
.mk-stop svg{position:absolute;left:10px;top:9px;width:20px;height:20px;stroke:#fff}

.maplibregl-popup-content{background:var(--card);color:var(--ink);border-radius:16px;box-shadow:var(--shadow-lg);padding:12px 14px;font-family:var(--body);min-width:210px}
.maplibregl-popup-tip{border-top-color:var(--card)!important;border-bottom-color:var(--card)!important}
.maplibregl-popup-close-button{font-size:18px;width:26px;height:26px;right:4px;top:4px;color:var(--muted);border-radius:50%}
.maplibregl-popup-close-button:hover{background:var(--tile)}
.pop b{display:block;font-size:14px;padding-right:18px}
.pop small{color:var(--muted);font-size:12px}
.pop .tl-tags{margin-top:6px}
.pop .tl-act{margin-top:10px}
.maplibregl-ctrl-group{border-radius:14px!important;overflow:hidden;box-shadow:var(--shadow)!important;background:var(--card)!important}
.maplibregl-ctrl-group button{width:34px;height:34px}
:root[data-theme="dark"] .maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:invert(1)}
.maplibregl-ctrl-attrib{font-size:10.5px}

/* ---------- stations ---------- */
.search{display:flex;align-items:center;gap:8px;background:var(--tile);border-radius:12px;padding:0 12px}
.search svg{width:18px;height:18px;color:var(--muted)}
.search input{background:transparent;border:0;padding:11px 0}
.search input:focus{background:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chips button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.chips button small{color:var(--muted);font-weight:700}
.chips button[aria-pressed="true"]{background:var(--pill);color:var(--pill-ink);border-color:var(--pill)}
.chips button[aria-pressed="true"] small{color:inherit;opacity:.75}
.list-card{padding:8px}
.st-list{list-style:none;margin:0;padding:0}
.st-list li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border-radius:14px;cursor:pointer}
.st-list li:hover,.st-list li[aria-current="true"]{background:var(--tile)}
.st-ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--og-soft)}
.st-ic img{width:20px;height:21px}
.st-ic.cng{background:var(--tile-2)}
.st-ic.cng i{width:12px;height:12px;border-radius:50%;background:var(--grey-pin)}
.st-list b{display:block;font-weight:700;font-size:13.5px;line-height:1.25}
.st-list small{color:var(--muted);font-size:12px}
.st-list .cc{font-size:11px;font-weight:700;color:var(--muted)}
.more{width:100%;margin-top:6px}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--pill);color:var(--pill-ink);padding:10px 18px;border-radius:999px;font-weight:600;font-size:13px;box-shadow:var(--shadow-lg);z-index:100;max-width:calc(100vw - 32px)}

/* ---------- embed-modus (iframe op website) ---------- */
body.embed .brand-txt small{display:none}
body.embed .app{padding-top:10px}

/* ---------- responsief ---------- */
@media (max-width:1100px){
  .layout{grid-template-columns:minmax(330px,400px) minmax(0,1fr)}
  .brand-txt small{display:none}
}
@media (max-width:860px){
  .app{height:auto;min-height:100dvh;padding:10px 12px 16px;gap:12px}
  .top{gap:8px}
  .nav{order:3;width:100%;margin:0}
  .nav button{flex:1}
  .tools{margin-left:auto}
  .layout{grid-template-columns:minmax(0,1fr);gap:12px}
  .side{display:contents}
  .layout>.side>:first-child{order:1}
  .layout>.mapcard{order:2;height:58vh;min-height:300px}
  .layout>.side>:not(:first-child){order:3}
  .card{border-radius:20px;padding:16px}
  h1{font-size:26px}
}
@media (max-width:420px){
  .grid-f{grid-template-columns:1fr}
  .kpi .val{font-size:26px}
  .kpi.hero .val{font-size:32px}
  .ex-grid{grid-template-columns:1fr}
  .brand-txt{display:none}
  .chip.brand{padding:4px}
}

/* ---------- print / PDF ---------- */
.print{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;color:#1A1A1A}
  .app,.toast{display:none!important}
  .print{display:block;font-family:var(--body);font-size:10.5pt;color:#1A1A1A}
  .pr-head{background:#13A538;color:#fff;border-radius:10px;padding:14px 18px;display:flex;align-items:center;gap:16px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pr-head img{height:44px}
  .pr-head h1{font-family:var(--display);color:#fff;font-size:24pt;line-height:1}
  .pr-head p{margin:3px 0 0;font-size:10pt;opacity:.9}
  .pr-head .pr-meta{margin-left:auto;text-align:right;font-size:9.5pt}
  .pr-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
  .pr-kpis div{border:1px solid #E2E5E1;border-radius:8px;padding:8px 10px}
  .pr-kpis small{display:block;font-size:7.5pt;text-transform:uppercase;letter-spacing:.06em;color:#69706A;font-weight:700}
  .pr-kpis b{font-family:var(--display);font-weight:400;font-size:15pt;white-space:nowrap}
  .pr-map{width:100%;border-radius:8px;border:1px solid #E2E5E1;display:block;max-height:95mm;object-fit:cover}
  .pr-h{font-size:9pt;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#0B4F22;margin:14px 0 6px}
  .print table{width:100%;border-collapse:collapse;font-size:9pt}
  .print th{text-align:left;font-size:7.5pt;text-transform:uppercase;letter-spacing:.05em;color:#69706A;border-bottom:1.5px solid #13A538;padding:4px 5px}
  .print td{border-bottom:1px solid #E2E5E1;padding:5px;vertical-align:top}
  .print td.r,.print th.r{text-align:right}
  .print tr{break-inside:avoid}
  .pr-og{color:#0E7A2A;font-weight:700}
  .pr-foot{margin-top:12px;font-size:8pt;color:#69706A}
}

</style>

</head>
<body>
<div class="app" id="app">

  <section class="layout" id="view-plan" data-panel="plan">
    <div class="side">

      <form class="card form" id="planForm" autocomplete="off" novalidate>
        <div class="card-h">
          <div><h1 data-i18n="planTitle">Plan je rit</h1><p class="sub" data-i18n="planSub">Tankstops langs OG-stations, berekend op je actieradius.</p></div>
        </div>

        <ol class="pts" id="pts" aria-label="Route"></ol>
        <div class="pts-actions">
          <button type="button" class="lnk" id="addVia"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="addVia">Tussenstop toevoegen</span></button>
          <button type="button" class="lnk" id="swap"><svg viewBox="0 0 24 24"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg><span data-i18n="swap">Omdraaien</span></button>
        </div>

        <details class="fold" id="vehFold" open>
          <summary><span data-i18n="vehicleTitle">Voertuig &amp; tank</span><span class="tag t-green" id="rangeChip"></span></summary>
          <div class="fold-b">
            <div class="seg wide" id="vehSeg" role="radiogroup" aria-label="Voertuig"></div>
            <div class="grid-f">
              <label class="fld"><span data-i18n="tankCap">Tankinhoud</span><div class="in-u"><input type="number" id="cap" min="5" max="600" step="1" inputmode="decimal"><i>kg</i></div></label>
              <label class="fld"><span data-i18n="consumption">Verbruik</span><div class="in-u"><input type="number" id="cons" min="1" max="80" step="0.1" inputmode="decimal"><i>kg/100 km</i></div></label>
              <label class="fld"><span data-i18n="dieselCons">Diesel ter vergelijking</span><div class="in-u"><input type="number" id="dcons" min="1" max="80" step="0.1" inputmode="decimal"><i>L/100 km</i></div></label>
              <label class="fld hgv-only"><span data-i18n="weightHeight">Gewicht · hoogte</span><div class="in-2"><div class="in-u"><input type="number" id="wt" min="1" max="60" step="0.5" inputmode="decimal"><i>t</i></div><div class="in-u"><input type="number" id="ht" min="1.5" max="4.5" step="0.05" inputmode="decimal"><i>m</i></div></div></label>
            </div>
            <label class="rng"><span><span data-i18n="startFill">Tank bij vertrek</span><output id="spOut"></output></span><input type="range" id="sp" min="10" max="100" step="5"></label>
            <label class="rng"><span><span data-i18n="reserve">Minimale reserve</span><output id="rsOut"></output></span><input type="range" id="rs" min="5" max="40" step="5"></label>
            <label class="rng"><span><span data-i18n="corridor">Max. afstand van de route</span><output id="corOut"></output></span><input type="range" id="cor" min="2" max="40" step="1"></label>
          </div>
        </details>

        <details class="fold" id="optFold">
          <summary><span data-i18n="optionsTitle">Vertrek &amp; opties</span></summary>
          <div class="fold-b">
            <div class="grid-f">
              <label class="fld"><span data-i18n="departure">Vertrek</span><input type="datetime-local" id="dep"></label>
              <label class="fld"><span data-i18n="stopMinutes">Duur per tankstop</span><div class="in-u"><input type="number" id="ref" min="0" max="90" step="5" inputmode="numeric"><i>min</i></div></label>
            </div>
            <label class="chk"><input type="checkbox" id="oth"><span data-i18n="useOther">Andere CNG-stations gebruiken als er geen OG-station bereikbaar is</span></label>
            <label class="chk ors-only"><input type="checkbox" id="tol"><span data-i18n="avoidTolls">Tolwegen vermijden</span></label>
            <label class="chk ors-only"><input type="checkbox" id="fer"><span data-i18n="avoidFerries">Veerboten vermijden</span></label>
          </div>
        </details>

        <details class="fold intern-only" id="intFold" hidden>

  function merge(a, b) {
    var out = {};
    Object.keys(a).forEach(function (k) { out[k] = a[k]; });
    Object.keys(b || {}).forEach(function (k) {
      var v = b[k];
      out[k] = (v && typeof v === 'object' && !Array.isArray(v) && a[k] && typeof a[k] === 'object')

    });
    return out;
  }

  window.OG_CONFIG = merge(defaults, window.OG_CONFIG || {});

/* ---- geo.js ---- */
/* Geometrie-hulpfuncties. Coördinaten in GeoJSON-volgorde: [lon, lat]. */
window.OG_GEO = (function () {
  var R = 6371.0088;
  var rad = Math.PI / 180;

  function hav(lat1, lon1, lat2, lon2) {
    var dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
  }

  /* Cumulatieve afstand (km) langs een lijn. */
  function cumulative(coords) {
    var cum = new Float64Array(coords.length);
    for (var i = 1; i < coords.length; i++) {
      cum[i] = cum[i - 1] + hav(coords[i - 1][1], coords[i - 1][0], coords[i][1], coords[i][0]);
    }
    return cum;
  }

  /* Dunt een lijn uit tot ongeveer één punt per stepKm, met hun km-positie. */
  function sample(coords, cum, stepKm) {
    var pts = [{ lon: coords[0][0], lat: coords[0][1], km: 0, i: 0 }];
    var last = 0;
    for (var i = 1; i < coords.length; i++) {
      if (cum[i] - last >= stepKm || i === coords.length - 1) {

    var b = [Infinity, Infinity, -Infinity, -Infinity];
    coords.forEach(function (c) {

/* ---- services.js ---- */
/* Externe diensten: adres zoeken (Photon, met ORS als terugval) en routering (ORS / proxy / OSRM). */
window.OG_SERVICES = (function () {
  var CFG = window.OG_CONFIG;

  function provider() {
    var p = CFG.routing.provider;
    if (p && p !== 'auto') return p;
    if (CFG.routing.proxyUrl) return 'proxy';
    if (CFG.routing.orsKey) return 'ors';
    return 'osrm';
  }

  function RoutingError(code, detail) {
    this.name = 'RoutingError';
    this.code = code;          // i18n-sleutel, zie i18n.js (err*)
    this.message = detail || code;
  }
  RoutingError.prototype = Object.create(Error.prototype);

  function fetchJson(url, opts, timeoutMs) {
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var t = ctrl ? setTimeout(function () { ctrl.abort(); }, timeoutMs || 30000) : null;
    opts = opts || {};
    if (ctrl) opts.signal = ctrl.signal;
    return fetch(url, opts).then(function (res) {
      if (t) clearTimeout(t);
      return res.text().then(function (txt) {
        var body = null;
        try { body = txt ? JSON.parse(txt) : null; } catch (e) { body = { raw: txt }; }
        return { ok: res.ok, status: res.status, body: body };
      });
    }, function (err) {
      if (t) clearTimeout(t);
      throw new RoutingError('errNetwork', String(err && err.message || err));
    });
  }

  /* ---------------- adres zoeken ---------------- */

  var PHOTON_LANGS = { en: 1, de: 1, fr: 1 };

  function photonLabel(p) {
    var main = p.name || [p.street, p.housenumber].filter(Boolean).join(' ') || p.city || p.country || '';
    var place = [p.postcode, p.city || p.town || p.village || p.county].filter(Boolean).join(' ');
    var parts = [];
    if (p.name && p.street) parts.push([p.street, p.housenumber].filter(Boolean).join(' '));
    if (place && place.indexOf(main) === -1) parts.push(place);
    else if (p.state && p.type !== 'state') parts.push(p.state);
    if (p.country) parts.push(p.country);
    return { main: main, detail: parts.join(', ') };
  }

  function searchPhoton(q, lang, bias) {
    var u = CFG.geocoder.photonBase.replace(/\/$/, '') + '/api/?q=' + encodeURIComponent(q) + '&limit=7';
    if (PHOTON_LANGS[lang]) u += '&lang=' + lang;
    if (bias) u += '&lat=' + bias[1].toFixed(3) + '&lon=' + bias[0].toFixed(3) + '&location_bias_scale=0.3';
    return fetchJson(u, {}, 8000).then(function (r) {
      if (!r.ok || !r.body || !r.body.features) throw new RoutingError('errGeocode');
      var seen = {};
      return r.body.features.map(function (f) {
        var l = photonLabel(f.properties);
        return {
          main: l.main, detail: l.detail,
          lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0],
          cc: (f.properties.countrycode || '').toUpperCase()
        };
      }).filter(function (x) {
        var k = x.main + '|' + x.detail;
        if (seen[k]) return false;
        seen[k] = 1;
        return true;
      });
    });
  }

  function searchOrs(q) {
    var url;
    if (CFG.routing.proxyUrl) url = CFG.routing.proxyUrl.replace(/\/$/, '') + '/geocode?text=' + encodeURIComponent(q);
    else if (CFG.routing.orsKey) url = CFG.routing.orsBase + '/geocode/search?size=7&api_key=' + encodeURIComponent(CFG.routing.orsKey) + '&text=' + encodeURIComponent(q);
    else return Promise.reject(new RoutingError('errGeocode'));
    return fetchJson(url, {}, 10000).then(function (r) {
      if (!r.ok || !r.body || !r.body.features) throw new RoutingError('errGeocode');
      return r.body.features.map(function (f) {
        var p = f.properties;
        return {
          main: p.name, detail: [p.locality, p.country].filter(Boolean).filter(function (x) { return x !== p.name; }).join(', '),
          lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0],
          cc: (p.country_code || '').toUpperCase()
        };
      });
    });
  }

  function search(q, lang, bias) {
    var m = /^\s*(-?\d{1,2}(?:\.\d+)?)\s*[,;\s]\s*(-?\d{1,3}(?:\.\d+)?)\s*$/.exec(q);
    if (m) {
      var lat = parseFloat(m[1]), lon = parseFloat(m[2]);
      if (Math.abs(lat) <= 90 && Math.abs(lon) <= 180) {
        return Promise.resolve([{ main: lat.toFixed(5) + ', ' + lon.toFixed(5), detail: '', lat: lat, lon: lon, cc: '' }]);
      }
    }
    return searchPhoton(q, lang, bias).catch(function () { return searchOrs(q); });
  }

  function reverse(lat, lon, lang) {
    var u = CFG.geocoder.photonBase.replace(/\/$/, '') + '/reverse?lat=' + lat + '&lon=' + lon + '&limit=1';
    if (PHOTON_LANGS[lang]) u += '&lang=' + lang;
    return fetchJson(u, {}, 8000).then(function (r) {
      var f = r.body && r.body.features && r.body.features[0];
      if (!f) return { main: lat.toFixed(5) + ', ' + lon.toFixed(5), detail: '', lat: lat, lon: lon, cc: '' };
      var l = photonLabel(f.properties);
      return { main: l.main, detail: l.detail, lat: lat, lon: lon, cc: (f.properties.countrycode || '').toUpperCase() };
    });
  }

  /* ---------------- routering ---------------- */

  function orsBody(points, opts) {
    var body = {
      coordinates: points.map(function (p) { return [+p.lon.toFixed(6), +p.lat.toFixed(6)]; }),
      radiuses: points.map(function () { return 3000; }),
      instructions: false,
      preference: 'recommended'
    };
    var o = {};
    var avoid = [];
    if (opts.avoidTolls) avoid.push('tollways');
    if (opts.avoidFerries) avoid.push('ferries');
    if (avoid.length) o.avoid_features = avoid;
    if (opts.profile === 'driving-hgv') {
      o.vehicle_type = 'hgv';
      var r = {};
      if (opts.weight) r.weight = +opts.weight;
      if (opts.height) r.height = +opts.height;
      if (Object.keys(r).length) o.profile_params = { restrictions: r };
    }
    if (Object.keys(o).length) body.options = o;
    return body;
  }

  function orsError(r) {
    var e = r.body && r.body.error;
    var code = e && (e.code || e);
    var msg = (e && e.message) || (r.body && r.body.raw) || ('HTTP ' + r.status);
    if (r.status === 401 || r.status === 403) return new RoutingError('errKey', msg);
    if (r.status === 429) return new RoutingError('errQuota', msg);
    if (code === 2010) return new RoutingError('errSnap', msg);
    if (code === 2004) return new RoutingError('errTooLong', msg);
    if (code === 2009) return new RoutingError('errNoRoute', msg);
    return new RoutingError('errRouting', msg);
  }

  function parseOrs(json) {
    var f = json && json.features && json.features[0];
    if (!f) throw new RoutingError('errNoRoute');
    var segs = (f.properties.segments || []).map(function (s) { return { distance: s.distance / 1000, duration: s.duration }; });
    return {
      coords: f.geometry.coordinates.map(function (c) { return [c[0], c[1]]; }),
      distance: f.properties.summary.distance / 1000,
      duration: f.properties.summary.duration,
      legs: segs
    };
  }

  function routeOrs(points, opts) {
    var profile = opts.profile || 'driving-hgv';
    var url = CFG.routing.orsBase.replace(/\/$/, '') + '/v2/directions/' + profile + '/geojson';
    return fetchJson(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/geo+json, application/json', 'Authorization': CFG.routing.orsKey },
      body: JSON.stringify(orsBody(points, opts))
    }, 45000).then(function (r) {
      if (!r.ok) throw orsError(r);
      return parseOrs(r.body);
    });
  }

  function routeProxy(points, opts) {
    var url = CFG.routing.proxyUrl.replace(/\/$/, '') + '/route';
    return fetchJson(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ profile: opts.profile || 'driving-hgv', body: orsBody(points, opts) })
    }, 45000).then(function (r) {
      if (!r.ok) throw orsError(r);
      return parseOrs(r.body);
    });
  }

  function routeOsrm(points) {
    var path = points.map(function (p) { return p.lon.toFixed(6) + ',' + p.lat.toFixed(6); }).join(';');
    var url = CFG.routing.osrmBase.replace(/\/$/, '') + '/route/v1/driving/' + path + '?overview=full&geometries=geojson&steps=false';
    var attempt = function () {
      return fetchJson(url, {}, 30000).then(function (r) {
        if (!r.ok || !r.body || r.body.code !== 'Ok') {
          if (r.status === 429) throw new RoutingError('errQuota');
          throw new RoutingError(r.body && r.body.code === 'NoRoute' ? 'errNoRoute' : 'errRouting', r.body && r.body.message);
        }
        var rt = r.body.routes[0];
        return {
          coords: rt.geometry.coordinates,
          distance: rt.distance / 1000,
          duration: rt.duration,
          legs: rt.legs.map(function (l) { return { distance: l.distance / 1000, duration: l.duration }; })
        };
      });
    };
    return attempt().catch(function (e) {
      if (e.code === 'errNetwork' || e.code === 'errRouting') return attempt();
      throw e;
    });
  }

  function route(points, opts) {
    var p = provider();
    var fn = p === 'proxy' ? routeProxy : p === 'ors' ? routeOrs : routeOsrm;
    return fn(points, opts || {}).then(function (res) { res.provider = p; return res; });
  }

  return {
    provider: provider,
    isTruckRouting: function () { return provider() !== 'osrm'; },
    search: search,
    reverse: reverse,
    route: route,
    RoutingError: RoutingError
  };
})();

/* ---- planner.js ---- */
/* Routeplanning met tankstops op basis van actieradius.
 *
 * Werkwijze
 *  1. Basisroute start → tussenstops → bestemming.
 *  2. Kandidaat-stations: binnen `corridorKm` van de route, met hun positie (km) langs de route.
 *  3. Optimale stopkeuze (kortste pad over alle kandidaten): zo min mogelijk stops, OG-stations
 *     sterk voorgetrokken (een ander CNG-station telt als 2,5 stop), weinig omrijden en geen
 *     onnodig bijtanken met een nog volle tank. Is de bestemming zo niet haalbaar, dan valt de
 *     planner terug op hebberig vooruit plannen en markeert hij het station na een 'gat'.
 *  4. Definitieve route via alle stops; tankniveau, aankomsttijden en kosten worden met de
 *     werkelijke afstanden per etappe doorgerekend.
 */
window.OG_PLANNER = (function () {
  var G = window.OG_GEO, S = window.OG_SERVICES, F = window.OG_FUEL;

  var FLAG_KEYS = { b: 'bio', u: 'unattended', k: 'card', d: 'depot', m: 'motorway' };
  var STATIONS = (window.OG_STATION_ROWS || []).map(function (r) {
    var flags = {};
    (r[5] || '').split('').forEach(function (ch) { if (FLAG_KEYS[ch]) flags[FLAG_KEYS[ch]] = true; });
    return { id: r[0], og: !!r[1], cc: r[2], brand: r[3], city: r[4], flags: flags, lat: r[6], lon: r[7] };
  });
  var BY_ID = {};
  STATIONS.forEach(function (s) { BY_ID[s.id] = s; });

  var DETOUR_FACTOR = 1.25;   // wegafstand ≈ 1,25 × hemelsbreed, heen en terug

  function nearestStation(lat, lon, maxKm, ogOnly) {
    var best = null, bd = maxKm || Infinity;
    STATIONS.forEach(function (s) {
      if (ogOnly && !s.og) return;
      var d = G.fastKm(lat, lon, s.lat, s.lon);
      if (d < bd) { bd = d; best = s; }
    });
    return best ? { station: best, km: bd } : null;
  }

  /* Stations binnen corridorKm van de route, met km-positie en geschatte omrijafstand. */
  function corridor(coords, cum, corridorKm) {
    var coarse = G.sample(coords, cum, 5);
    var fine = G.sample(coords, cum, 0.5);
    var b = G.bbox(coords);
    var midLat = (b[1] + b[3]) / 2;
    var dLat = corridorKm / 111, dLon = corridorKm / (111 * Math.cos(midLat * Math.PI / 180));
    var out = [];
    STATIONS.forEach(function (s) {
      if (s.lat < b[1] - dLat || s.lat > b[3] + dLat || s.lon < b[0] - dLon || s.lon > b[2] + dLon) return;
      var c = G.nearestOnLine(coarse, s.lat, s.lon);
      if (c.d > corridorKm + 4) return;
      // verfijn rond het grove punt
      var lo = Math.max(0, c.km - 6), hi = c.km + 6, best = { d: Infinity, km: 0 };
      for (var i = 0; i < fine.length; i++) {
        if (fine[i].km < lo) continue;
        if (fine[i].km > hi) break;
        var d = G.fastKm(s.lat, s.lon, fine[i].lat, fine[i].lon);
        if (d < best.d) best = { d: d, km: fine[i].km };
      }
      if (best.d <= corridorKm) {
        out.push({ station: s, km: best.km, off: best.d, detour: 2 * best.d * DETOUR_FACTOR });
      }
    });
    out.sort(function (a, b) { return a.km - b.km; });
    return out;
  }

  function score(c) { return c.km - c.detour * 0.8; }

    var b = null;
    list.forEach(function (c) { if (!b || score(c) > score(b)) b = c; });
    return b;
  }

  /* Kosten van een tankstop in de optimalisatie: elke stop telt, een niet-OG-stop telt zwaarder,
   * omrijden kost iets, en tanken met een nog vrij volle tank wordt ontmoedigd. */
  var COST = { stop: 1, other: 1.5, perDetourKm: 1 / 40, fullTank: 0.6 };

  /* Optimale keuze (kortste pad over de kandidaten). Geeft null als de bestemming
   * met deze instellingen niet haalbaar is; dan valt chooseStops terug op de hebberige methode. */
  function optimalStops(cands, total, fullRange, startRange, allowOther) {
    var nodes = cands.filter(function (c) { return c.station.og || allowOther; });
    var n = nodes.length;
    var cost = new Array(n), prev = new Array(n);
    var reach = function (fromKm, fromDetour, range, toKm, toDetour) {
      var need = (toKm - fromKm) + fromDetour / 2 + toDetour / 2;

    };

        var cc = cost[i] + stopCost + COST.fullTank * left / Math.max(1, fullRange);

  /* Kiest de tankstops langs de basisroute. Afstanden in km actieradius. */
  function chooseStops(cands, total, st) {
    var reserveKg = st.cap * st.reservePct / 100;
    var fullRange = Math.max(0, (st.cap - reserveKg) / st.cons * 100);
    var range = (st.cap * st.startPct / 100 - reserveKg) / st.cons * 100;
    var startRange = range;

    if (opt) return { stops: opt, gaps: [], gapToEnd: null, fullRange: fullRange, startRange: startRange };
    var pos = 0, stops = [], used = {}, gaps = [], gapToEnd = null;
    var allowed = function (c) { return c.station.og || st.allowOther; };

    for (var guard = 0; guard < 80 && pos + range < total - 0.5; guard++) {
      var first = stops.length === 0;
      var reach = cands.filter(function (c) {

          (c.km - pos) + c.detour / 2 <= range;
      });
      var pick = best(reach.filter(function (c) { return c.station.og; })) ||
        (st.allowOther ? best(reach.filter(function (c) { return !c.station.og; })) : null);

      if (pick) {
        stops.push({ cand: pick, gap: false });
      } else {
        var ahead = cands.filter(function (c) { return !used[c.station.id] && c.km > pos + 0.5 && allowed(c); });
        var next = ahead.length ? ahead[0] : null;
        var otherWouldHelp = !st.allowOther && cands.some(function (c) {
          return !c.station.og && c.km > pos && (c.km - pos) + c.detour / 2 <= range;
        });
        if (!next) {
          gapToEnd = { fromKm: pos, reachKm: pos + Math.max(0, range), otherWouldHelp: otherWouldHelp };
          break;
        }
        gaps.push({ fromKm: pos, reachKm: pos + Math.max(0, range), nextKm: next.km, otherWouldHelp: otherWouldHelp });
        stops.push({ cand: next, gap: true });
        pick = next;
      }
      used[pick.station.id] = true;
      pos = pick.km;
      range = fullRange - pick.detour / 2;
    }

  }

  /* Positie (km) van de tussenstops op de basisroute, oplopend. */
  function viaPositions(coords, cum, vias) {
    var pts = G.sample(coords, cum, 0.5);
    var from = 0;
    return vias.map(function (v) {
      var n = G.nearestOnLine(pts, v.lat, v.lon, from);
      from = n.idx;
      return n.km;
    });
  }

  function cngPrice(cc, st) {
    var base = F.cng[cc], avg = false;
    if (base == null) { base = mean(F.cng); avg = true; }
    if (st.price && st.price.mode === 'fix' && st.price.fix > 0) base = st.price.fix;
    else if (st.price && st.price.mode === 'pct' && st.price.pct > 0) base = base * (1 - st.price.pct / 100);
    return { price: base, avg: avg && !(st.price && st.price.mode === 'fix') };

  function dieselPrice(cc) {

  function simulate(wps, legs, st) {

    var minArrival = Infinity;
    wps.forEach(function (w, j) {
      if (j > 0) {
        var leg = legs[j - 1] || { distance: 0, duration: 0 };
        fuel -= leg.distance * st.cons / 100;
        km += leg.distance;
        t += leg.duration * 1000;
        chart.push({ km: km, pct: fuel / st.cap });

      w.arrive = new Date(t);
      w.arrivePct = fuel / st.cap;

  }

        order.push(key);

      var r = rows[key];
      var kg = seg * st.cons / 100, l = seg * st.dcons / 100;
      r.km += seg; r.cngKg += kg; r.cngEur += kg * cp.price; r.dieselL += l; r.dieselEur += l * dp.price;
    });
    var list = order.map(function (k) { return rows[k]; });
    var tot = list.reduce(function (a, r) {
      a.km += r.km; a.cngKg += r.cngKg; a.cngEur += r.cngEur; a.dieselL += r.dieselL; a.dieselEur += r.dieselEur;
      return a;
    }, { km: 0, cngKg: 0, cngEur: 0, dieselL: 0, dieselEur: 0 });
    tot.saving = tot.dieselEur - tot.cngEur;
    tot.savingPct = tot.dieselEur ? tot.saving / tot.dieselEur * 100 : 0;
    tot.co2Cng = tot.cngKg * F.co2PerKgCng;
    tot.co2Diesel = tot.dieselL * F.co2PerLDiesel;
    tot.co2Avoided = tot.co2Diesel - tot.co2Cng;
    return { rows: list, total: tot };
  }

  /* points: [{lat, lon, label, cc}] (start, tussenstops, bestemming); st: instellingen. */
  function plan(points, st, onStep) {
    var opts = { profile: st.profile, avoidTolls: st.avoidTolls, avoidFerries: st.avoidFerries, weight: st.weight, height: st.height };
    var step = onStep || function () {};
    step('stepBase');
    return S.route(points, opts).then(function (base) {
      var cum = G.cumulative(base.coords);
      var total = cum[cum.length - 1];
      step('stepStations');
      var cands = corridor(base.coords, cum, st.corridorKm);
      var choice = chooseStops(cands, total, st);
      var vias = points.slice(1, -1);
      var viaKm = viaPositions(base.coords, cum, vias);

      var middle = vias.map(function (v, i) { return { type: 'via', km: viaKm[i], point: v, n: i + 1 }; })
        .concat(choice.stops.map(function (s) {
          return { type: 'stop', km: s.cand.km, station: s.cand.station, gap: s.gap, detour: s.cand.detour, off: s.cand.off };
        }))
        .sort(function (a, b) { return a.km - b.km || (a.type === 'via' ? -1 : 1); });

      var wps = [{ type: 'start', point: points[0] }].concat(middle, [{ type: 'end', point: points[points.length - 1] }]);
      var stopNo = 0;
      wps.forEach(function (w) { if (w.type === 'stop') w.n = ++stopNo; });

      var finalP = choice.stops.length
        ? (step('stepFinal'), S.route(wps.map(function (w) { return w.point || w.station; }), opts))
        : Promise.resolve(base);

      return finalP.then(function (fin) {
        var sim = simulate(wps, fin.legs, st);
        var startCc = points[0].cc || (nearestStation(points[0].lat, points[0].lon, 120) || { station: {} }).station.cc || null;
        var cost = costs(wps, st, startCc);
        var nStops = choice.stops.length;
        var driveSec = fin.duration;
        return {
          points: points,
          settings: st,
          provider: base.provider,
          coords: fin.coords,
          baseCoords: base.coords,
          distance: fin.distance,
          driveSec: driveSec,
          totalSec: driveSec + nStops * (st.refuelMin || 0) * 60,
          waypoints: wps,
          stops: wps.filter(function (w) { return w.type === 'stop'; }),
          candidates: cands,
          gaps: choice.gaps,
          gapToEnd: choice.gapToEnd,
          fullRange: choice.fullRange,
          startRange: choice.startRange,
          chart: sim.chart,
          arrival: sim.arrival,
          arrivalPct: sim.arrivalPct,
          minStopArrival: sim.minStopArrival,
          costs: cost,
          startCc: startCc
        };
      });
    });
  }

  function rangeKm(st) {
    return Math.max(0, (st.cap * (1 - st.reservePct / 100)) / st.cons * 100);
  }

  return {
    stations: STATIONS,
    byId: BY_ID,
    plan: plan,
    rangeKm: rangeKm,
    nearestStation: nearestStation,
    cngPrice: cngPrice,
    dieselPrice: dieselPrice
  };
})();

/* Export en delen: Google Maps, Waze, GPX, CSV en deellinks. */
window.OG_EXPORT = (function () {
  var CFG = window.OG_CONFIG;

  function ll(p) { return p.lat.toFixed(6) + ',' + p.lon.toFixed(6); }

  /* Google Maps staat in een browser maximaal 9 tussenpunten toe. */
  function googleMaps(points) {
    var MAX = 9;
    var mid = points.slice(1, -1);
    var url = 'https://www.google.com/maps/dir/?api=1&travelmode=driving' +
      '&origin=' + encodeURIComponent(ll(points[0])) +
      '&destination=' + encodeURIComponent(ll(points[points.length - 1]));
    if (mid.length) url += '&waypoints=' + encodeURIComponent(mid.slice(0, MAX).map(ll).join('|'));
    return { url: url, truncated: mid.length > MAX };
  }

  function googleTo(p) {
    return 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=' + encodeURIComponent(ll(p));
  }

  function waze(p) {
    return 'https://waze.com/ul?ll=' + encodeURIComponent(ll(p)) + '&navigate=yes';
  }

  function xml(s) {
    return String(s == null ? '' : s).replace(/[<>&"']/g, function (c) {
      return { '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&apos;' }[c];
    });
  }

  /* GPX 1.1 met de tankstops als waypoints, de route als rtept (voor navigatiesystemen) en het spoor als trk. */
  function gpx(name, wps, coords) {
    var out = ['<?xml version="1.0" encoding="UTF-8"?>',
      '<gpx version="1.1" creator="OG Clean Fuels Routeplanner" xmlns="http://www.topografix.com/GPX/1/1">',
      '<metadata><name>' + xml(name) + '</name><time>' + new Date().toISOString() + '</time></metadata>'];
    wps.forEach(function (w) {
      out.push('<wpt lat="' + w.lat.toFixed(6) + '" lon="' + w.lon.toFixed(6) + '"><name>' + xml(w.name) + '</name>' +
        (w.desc ? '<desc>' + xml(w.desc) + '</desc>' : '') + (w.sym ? '<sym>' + xml(w.sym) + '</sym>' : '') + '</wpt>');
    });
    out.push('<rte><name>' + xml(name) + '</name>');
    wps.forEach(function (w) {
      out.push('<rtept lat="' + w.lat.toFixed(6) + '" lon="' + w.lon.toFixed(6) + '"><name>' + xml(w.name) + '</name></rtept>');
    });
    out.push('</rte>');
    out.push('<trk><name>' + xml(name) + '</name><trkseg>');
    var step = Math.max(1, Math.floor(coords.length / 5000));
    for (var i = 0; i < coords.length; i += step) {
      out.push('<trkpt lat="' + coords[i][1].toFixed(5) + '" lon="' + coords[i][0].toFixed(5) + '"/>');
    }
    var last = coords[coords.length - 1];
    out.push('<trkpt lat="' + last[1].toFixed(5) + '" lon="' + last[0].toFixed(5) + '"/>');
    out.push('</trkseg></trk></gpx>');
    return out.join('\n');
  }

  /* CSV met ; als scheidingsteken en BOM, zodat Excel (NL-instellingen) hem direct goed opent. */
  function csv(rows) {
    var esc = function (v) {
      var s = v == null ? '' : String(v);
      return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    return '\ufeff' + rows.map(function (r) { return r.map(esc).join(';'); }).join('\r\n');
  }

  function download(filename, text, mime) {
    var blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }

  function safeName(s) {
    return (s || 'route').normalize('NFKD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w\-]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 60) || 'route';
  }

  /* ---------- deellinks ---------- */

  function b64urlEncode(str) {
    var bytes = new TextEncoder().encode(str), bin = '';
    bytes.forEach(function (b) { bin += String.fromCharCode(b); });
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function b64urlDecode(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var bin = atob(s), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  function encodeState(obj) { return b64urlEncode(JSON.stringify(obj)); }
  function decodeState(s) {
    try { return JSON.parse(b64urlDecode(s)); } catch (e) { return null; }
  }

  /* De pagina kan in een iframe draaien (Streamlit, website). Probeer dan de URL van het hoofdvenster. */
  function pageUrl() {
    if (CFG.publicUrl) return CFG.publicUrl;
    try {
      var top = window.top.location;
      if (top.href && top.protocol.indexOf('http') === 0) return top.origin + top.pathname;
    } catch (e) { /* ander domein */ }
    var here = window.location;
    if (here.protocol.indexOf('http') === 0) return here.origin + here.pathname;
    return '';
  }

  function readParams() {
    var out = {};
    var add = function (search) {
      if (!search) return;
      new URLSearchParams(search).forEach(function (v, k) { if (!(k in out)) out[k] = v; });
    };
    add(window.location.search);
    if (window.location.hash.length > 1) add(window.location.hash.slice(1));
    try { if (window.top !== window) add(window.top.location.search); } catch (e) { /* ander domein */ }
    return out;
  }

  function copy(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return fallbackCopy(text); });
    }
    return Promise.resolve(fallbackCopy(text));
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    return ok;
  }

  return {
    googleMaps: googleMaps, googleTo: googleTo, waze: waze,
    gpx: gpx, csv: csv, download: download, safeName: safeName,
    encodeState: encodeState, decodeState: decodeState, pageUrl: pageUrl, readParams: readParams, copy: copy
  };
})();

      } });

      layout: { 'text-field': ['get', 'point_count_abbreviated'], 'text-font': ['Noto Sans Bold'], 'text-size': 12, 'text-allow-overlap': true },
      paint: { 'text-color': '#fff' } });
    map.addLayer({ id: 'st-pts', type: 'circle', source: 'stations', filter: ['!', ['has', 'point_count']],
      paint: {
        'circle-radius': ['interpolate', ['linear'], ['zoom'], 5, ['case', ['get', 'og'], 6, 4], 12, ['case', ['get', 'og'], 11, 7]],
        'circle-color': ['case', ['get', 'og'], '#ffffff', C.cng],

  function bindEvents() {

  function addMarker(el, lngLat, onClick, anchor, meta) {
    var mk = new maplibregl.Marker({ element: el, anchor: anchor || 'center' }).setLngLat(lngLat).addTo(map);

    var used = {};
    res.stops.forEach(function (w) { used[w.station.id] = true; });
    setSource('corridor', stationsFC(res.candidates.map(function (c) { return c.station; }).filter(function (s) { return !used[s.id]; })));
    clearMarkers();
    res.waypoints.forEach(function (w) {
      if (w.type === 'start') addMarker(div('mk start', 'A'), [w.point.lon, w.point.lat], function () { stopClick && stopClick(w); }, null, { fill: '#13A538', ink: '#fff', label: 'A' }).getElement().title = labels.start;
      else if (w.type === 'end') addMarker(div('mk end', 'B'), [w.point.lon, w.point.lat], function () { stopClick && stopClick(w); }, null, { fill: '#1A1A1A', ink: '#fff', label: 'B' }).getElement().title = labels.end;
      else if (w.type === 'via') addMarker(div('mk via', String(w.n)), [w.point.lon, w.point.lat], function () { stopClick && stopClick(w); }, null, { fill: '#fff', ink: '#1A1A1A', label: String(w.n) });
      else {
        var cls = 'mk-stop ' + (w.gap ? 'gap' : (w.station.og ? 'og' : 'cng'));
        var inner = w.gap
          ? '<div class="pin"></div><svg viewBox="0 0 24 24"><path d="M12 7v6M12 17h.01"/></svg>'
          : w.station.og
            ? '<div class="pin"></div><img src="' + sparkUrl + '" alt="">'
            : '<div class="pin"></div><svg viewBox="0 0 24 24"><path d="M5 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M3 21h14M15 10h2a2 2 0 0 1 2 2v5a1 1 0 0 0 2 0V8l-3-3"/></svg>';
        var el = div(cls, inner + '<b>' + w.n + '</b>');
        addMarker(el, [w.station.lon, w.station.lat], function () { stopClick && stopClick(w); }, 'bottom',
          { fill: w.gap ? '#C9372C' : w.station.og ? '#F18700' : '#7A817B', ink: w.gap || !w.station.og ? '#fff' : '#1a1200', label: String(w.n) });
      }

  }

  function showStationPopup(s, extraHtml) {

  function flyTo(lon, lat, zoom) { map.flyTo({ center: [lon, lat], zoom: zoom || Math.max(map.getZoom(), 11), speed: 1.6 }); }
  /* Kaartafbeelding voor de PDF: past de route in beeld, wacht tot de tegels geladen zijn
   * en tekent de (HTML-)markers op het canvas. */
  function snapshot(coords) {
    return new Promise(function (resolve) {
      var done = function () {

    if (s.flags.motorway) tags.push('<span class="tag t-blue">' + esc(t('fMotorway')) + '</span>');
    return tags.concat(extra || []).join('');
  }

      '<div class="kpi hero"><div><div class="lab">' + esc(saveLbl) + '</div><div class="val">' + eur(Math.abs(c.saving)) + '</div><div class="dl">' +

      '<div class="side-v"><div class="lab">' + esc(t('kpiCo2')) + '</div><div class="val">' + nf(c.co2Avoided / 1000, 1) + '<small>t</small></div><div class="dl">' + esc(t('kpiCo2Dl')) + '</div></div></div>' +
      kpi(t('kpiDistance'), nf(res.distance), 'km', '') +
      kpi(t('kpiTime'), dur(res.totalSec), '', t('kpiTimeDl', { d: dur(res.driveSec) })) +
      kpi(t('kpiStops'), String(res.stops.length), '', res.stops.length ? t('kpiStopsDl', { og: nOg, other: nOther }) : t('kpiStopsNone')) +
      kpi(t('kpiArrival'), clock(res.arrival, st.departure), '', t('tankLevel', { p: pct(Math.max(0, res.arrivalPct)) })) +

    /* ritverloop */

    /* tankgrafiek */

      '</div>' +
      '<table class="tbl"><thead><tr><th>' + esc(t('thCountry')) + '</th><th>km</th><th>Bio-CNG</th><th>Diesel</th><th>' + esc(t('thDiff')) + '</th></tr></thead><tbody>' +
      res.costs.rows.map(function (r) {
        return '<tr><td>' + flag(r.cc) + ' ' + esc(r.cc ? country(r.cc) : t('unknown')) + (r.avg ? ' <small class="tag t-grey">' + esc(t('avg')) + '</small>' : '') + '</td><td>' + nf(r.km) + '</td>' +

          '<td class="' + (r.dieselEur - r.cngEur >= 0 ? 'sav' : 'neg') + '">' + eur(r.dieselEur - r.cngEur) + '</td></tr>';

      '<p class="note">' + esc(t('costNote', { date: priceDate(), cons: nf(st.cons, 1), dcons: nf(st.dcons, 1) })) + (anyAvg ? ' ' + esc(t('costNoteAvg')) : '') + '</p></div>');

    /* export */

      '<button type="button" class="ex wide" data-x="share">' + ICON.link + '<span><b>' + esc(t('exShare')) + '</b><small>' + esc(t('exShareD')) + '</small></span></button>' +
      '<a class="ex" href="' + esc(gm.url) + '" target="_blank" rel="noopener">' + ICON.gmaps + '<span><b>Google Maps</b><small>' + esc(gm.truncated ? t('exGmapsTrunc') : t('exGmapsD')) + '</small></span></a>' +
      '<button type="button" class="ex" data-x="gpx">' + ICON.gpx + '<span><b>GPX</b><small>' + esc(t('exGpxD')) + '</small></span></button>' +
      '<button type="button" class="ex" data-x="pdf">' + ICON.pdf + '<span><b>PDF</b><small>' + esc(t('exPdfD')) + '</small></span></button>' +
      '<button type="button" class="ex" data-x="csv">' + ICON.csv + '<span><b>CSV</b><small>' + esc(t('exCsvD')) + '</small></span></button>' +
      '</div></div>');

    $('#results').innerHTML = html.join('');
    bindResultEvents(res);
